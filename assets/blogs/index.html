<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Blogs</title>

        <style>
            :root {
                --bg: #000000;
                --text-main: #d4d4d4;
                --text-muted: #888888;
                --text-bright: #ffffff;
                --font-mono:
                    ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
                    "Liberation Mono", "Courier New", monospace;
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                background: var(--bg);
                color: var(--text-main);
                font-family: var(--font-mono);
                display: flex;
                justify-content: center;
                min-height: 100vh;
                padding: 4rem 2rem;
                line-height: 1.7;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            main {
                width: 100%;
                max-width: 60ch;
            }

            h1 {
                font-size: 1.5rem;
                font-weight: 400;
                color: var(--text-bright);
                margin-bottom: 3rem;
            }

            .posts {
                display: flex;
                flex-direction: column;
                gap: 1rem;
            }

            a {
                color: var(--text-muted);
                text-decoration: none;
                transition: color 0.2s ease;
                width: fit-content;
            }

            a:hover {
                color: var(--text-bright);
            }

            nav {
                margin-top: 3rem;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>blogs</h1>

            <div class="posts">
                <a href="./blog001.html"> 001. My Mind Became Zero </a>

                <a href="./blog002.html"> 002. The urge to have nothing </a>
                <p style="color : var(--text-muted)"> 003. Coming Soon... </p>
            </div>

            <nav>
                <a href="../../index.html">← back</a>
            </nav>
        </main>
    </body>
</html>
