<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Vishal Kannan</title>
        <meta
            name="description"
            content="Product designer who builds. Working across a few small companies at a time."
        />
        <style>
            :root {
                --bg: #fafaf8;
                --ink: #171715;
                --muted: #8c8c86;
                --line: #e4e3dd;
                --link-hover: #171715;
                --font-size:1.1rem;
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            html {
                -webkit-font-smoothing: antialiased;
            }

            body {
                background: var(--bg);
                color: var(--ink);
                font-family: system-ui, -apple-system, sans-serif;
                font-size: 15px;
                line-height: 1.6;
                letter-spacing: -0.04em;
            }

            .wrap {
                max-width: 560px;
                margin: 0 200px;
                padding: 96px 24px 120px;
                transform: translateX(-24px);
            }

            .name {
                font-size:var(--font-size);
                font-weight: 600;
                margin-bottom: 40px;
            }

            .bio {
                font-size:var(--font-size);
                color: var(--ink);
                margin-bottom: 12px;
                max-width: 480px;
            }

            .bio a,
            .contact a {
                color: var(--ink);
                text-decoration: underline;
                text-decoration-color: var(--line);
                text-underline-offset: 3px;
            }
            .bio a:hover,
            .contact a:hover {
                text-decoration-color: var(--link-hover);
            }

            .contact {
                margin-top: 28px;
                margin-bottom: 72px;
                color: var(--muted);
                font-size: 15px;
            }

            .socials {
                display: flex;
                gap: 20px;
                margin-top: 28px;
                margin-bottom: 72px;
            }

            .socials a {
                color: var(--ink);
                var(--font-size);
                text-decoration: underline;
                text-decoration-color: var(--line);
                text-underline-offset: 3px;
            }
            .socials a:hover {
                text-decoration-color: var(--link-hover);
            }

            .row {
                display: flex;
                align-items: baseline;
                justify-content: flex-start;
                padding: 9px 0;
                border-bottom: 1px solid transparent;
            }

            .row a {
                color: var(--ink);
                text-decoration: none;
                var(--font-size);
                font-weight: 500;
                position: relative;
            }

            .row a::after {
                content: "";
                position: absolute;
                left: 0;
                right: 0;
                bottom: -1px;
                height: 1px;
                background: var(--ink);
            }

            .row .arrow {
                display: inline-block;
                margin-left: 5px;
            }

            a:focus-visible,
            button:focus-visible {
                outline: 2px solid var(--ink);
                outline-offset: 3px;
            }

            @media (max-width: 640px) {
                .wrap {
                    margin: 0 auto;
                    padding: 64px 24px 80px;
                    transform: none;
                }
                .name {
                    margin-bottom: 32px;
                }
                .bio {
                    max-width: 100%;
                }
                .contact {
                    margin-bottom: 56px;
                }
                .socials {
                    margin-bottom: 56px;
                    gap: 16px;
                }
            }
        </style>
    </head>
    <body>
        <div class="wrap">
            <div class="name">Vishal Kannan.</div>

            <p class="bio">
                Learning full-stack web development by building real-world
                applications with the MERN stack and continuously improving my
                understanding of modern web technologies.
            </p>

            <div class="socials">
                <a
                    href="https://github.com/VISHALKANNAN070"
                    target="_blank"
                    rel="noopener"
                    >GitHub</a
                >
                <a href="mailto:vishalkannan070@gmail.com">Mail</a>
                <a href="https://drive.google.com/file/d/1MwQfnxceUGP1OMjzBZziUsu0Qj-MLkcA/view?usp=sharing" target="_blank" rel="noopener">Resume</a>
            </div>

            <div class="work">
                <div class="row">
                    <a href="https://github.com/VISHALKANNAN070/Neptune" target="_blank" rel="noopener"
                        >Neptune<span class="arrow">↗</span></a
                    >
                </div>
                <div class="row">
                    <a href="https://github.com/VISHALKANNAN070/LitMap" target="_blank" rel="noopener"
                        >LitMap<span class="arrow">↗</span></a
                    >
                </div>
                <div class="row">
                    <a href="https://github.com/VISHALKANNAN070/SyncSpace" target="_blank" rel="noopener"
                        >SyncSpace<span class="arrow">↗</span></a
                    >
                </div>
                <div class="row">
                    <a href="https://github.com/VISHALKANNAN070/NotesApp" target="_blank" rel="noopener"
                        >NotesApp<span class="arrow">↗</span></a
                    >
                </div>
            </div>
        </div>
    </body>
</html>
